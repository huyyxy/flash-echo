model: minimind3
default_persona: male_white_collar
version: v1.0.2

paths:
  raw_data: data/raw/sft_t2t_mini.jsonl
  cleaned_data_dir: data/filler_prefix/{persona}
  pretrained_model: models/pretrained/jingyaogong-minimind-3
  checkpoint_root: models/checkpoints/minimind3-filler-{persona}-{version}
  checkpoint: models/checkpoints/minimind3-filler-{persona}-{version}/best
  deploy_dir: models/deploy/minimind3-filler-{persona_dash}-{version}

cos:
  bucket_url: https://weights-1305049745.cos.ap-shanghai.myqcloud.com
  remote_root: flash-echo
  base_model: minimind3
  checkpoint_prefix: "{cos.remote_root}/{cos.base_model}/{version}/{persona}/checkpoint/best"
  deploy_prefix: "{cos.remote_root}/{cos.base_model}/{version}/{persona}/deploy"

train:
  epochs: 3
  batch_size: 8
  eval_batch_size: 16
  save_epoch_checkpoint_interval: 1
  use_lora: false

pipelines:
  data:
    - clean_data
    - audit_data
  download:
    - download_pretrained
  train:
    - download_pretrained
    - finetune
  export:
    - export_onnx
  upload_checkpoint:
    - upload_checkpoint
  download_checkpoint:
    - download_checkpoint
  upload_deploy:
    - upload_deploy
  download_deploy:
    - download_deploy
  upload_model:
    - upload_deploy
  download_model:
    - download_deploy
  infer:
    - serve
  full:
    - clean_data
    - audit_data
    - download_pretrained
    - build_train_image
    - finetune
    - build_export_image
    - export_onnx
    - build_infer_image
    - serve

steps:
  clean_data:
    runtime: docker.cpu
    command:
      - python3
      - tools/training/prepare_sharegpt_filler_prefix.py
      - --input
      - "{paths.raw_data}"
      - --output-dir
      - "{paths.cleaned_data_dir}"
      - --persona
      - "{persona}"
    inputs:
      - "{paths.raw_data}"
    outputs:
      - "{paths.cleaned_data_dir}/train.jsonl"
      - "{paths.cleaned_data_dir}/valid.jsonl"
      - "{paths.cleaned_data_dir}/test.jsonl"
    resume: true

  audit_data:
    runtime: docker.cpu
    command:
      - python3
      - tools/training/audit_filler_prefix.py
      - --data-dir
      - "{paths.cleaned_data_dir}"
    inputs:
      - "{paths.cleaned_data_dir}/train.jsonl"
      - "{paths.cleaned_data_dir}/valid.jsonl"
      - "{paths.cleaned_data_dir}/test.jsonl"
    outputs: []
    resume: false

  download_pretrained:
    runtime: docker.cpu
    command:
      - python3
      - tools/training/download_minimind3_pretrained.py
    outputs:
      - "{paths.pretrained_model}"
    resume: true

  build_train_image:
    runtime: local
    image: minimind3.train
    command:
      - docker
      - build
      - --platform
      - linux/amd64
      - -t
      - ccr.ccs.tencentyun.com/huyyxy/flash-echo:minimind3-train
      - -f
      - docker/minimind3/Dockerfile.train
      - .
    outputs: []
    resume: false

  finetune:
    runtime: docker.cuda
    command:
      - python3
      - tools/training/train_minimind3_sft.py
      - --persona
      - "{persona}"
      - --train
      - "{paths.cleaned_data_dir}/train.jsonl"
      - --valid
      - "{paths.cleaned_data_dir}/valid.jsonl"
      - --test
      - "{paths.cleaned_data_dir}/test.jsonl"
      - --base-model
      - "{paths.pretrained_model}"
      - --output-dir
      - "{paths.checkpoint_root}"
      - --model-version
      - "minimind3-filler-{persona}-{version}"
      - --epochs
      - "{train.epochs}"
      - --batch-size
      - "{train.batch_size}"
      - --eval-batch-size
      - "{train.eval_batch_size}"
      - --save-epoch-checkpoint-interval
      - "{train.save_epoch_checkpoint_interval}"
    inputs:
      - "{paths.cleaned_data_dir}/train.jsonl"
      - "{paths.cleaned_data_dir}/valid.jsonl"
      - "{paths.pretrained_model}"
    outputs:
      - "{paths.checkpoint}/model_card.json"
    resume: true

  upload_checkpoint:
    runtime: docker.cpu
    command:
      - python3
      - tools/storage/cos_model_sync.py
      - upload
      - --local-dir
      - "{paths.checkpoint}"
      - --remote-prefix
      - "{cos.checkpoint_prefix}"
      - --bucket-url
      - "{cos.bucket_url}"
      - --timeout
      - "600"
    inputs:
      - "{paths.checkpoint}/model_card.json"
    outputs: []
    resume: false

  download_checkpoint:
    runtime: docker.cpu
    command:
      - python3
      - tools/storage/cos_model_sync.py
      - download
      - --local-dir
      - "{paths.checkpoint}"
      - --remote-prefix
      - "{cos.checkpoint_prefix}"
      - --bucket-url
      - "{cos.bucket_url}"
    outputs:
      - "{paths.checkpoint}/model_card.json"
    resume: true

  export_onnx:
    runtime: docker.minimind3-export
    command:
      - python3
      - tools/export/export_minimind3_onnx.py
      - --persona
      - "{persona}"
      - --checkpoint
      - "{paths.checkpoint}"
      - --output-dir
      - "{paths.deploy_dir}"
      - --model-version
      - "minimind3-filler-{persona_dash}-{version}"
    inputs:
      - "{paths.checkpoint}"
    outputs:
      - "{paths.deploy_dir}/model.onnx"
      - "{paths.deploy_dir}/inference_config.json"
    resume: true

  upload_deploy:
    runtime: docker.cpu
    command:
      - python3
      - tools/storage/cos_model_sync.py
      - upload
      - --local-dir
      - "{paths.deploy_dir}"
      - --remote-prefix
      - "{cos.deploy_prefix}"
      - --bucket-url
      - "{cos.bucket_url}"
      - --timeout
      - "600"
    inputs:
      - "{paths.deploy_dir}/model.onnx"
      - "{paths.deploy_dir}/inference_config.json"
    outputs: []
    resume: false

  download_deploy:
    runtime: docker.cpu
    command:
      - python3
      - tools/storage/cos_model_sync.py
      - download
      - --local-dir
      - "{paths.deploy_dir}"
      - --remote-prefix
      - "{cos.deploy_prefix}"
      - --bucket-url
      - "{cos.bucket_url}"
    outputs:
      - "{paths.deploy_dir}/model.onnx"
      - "{paths.deploy_dir}/inference_config.json"
    resume: true

  build_export_image:
    runtime: local
    image: minimind3.export
    command:
      - docker
      - build
      - --platform
      - linux/amd64
      - -t
      - ccr.ccs.tencentyun.com/huyyxy/flash-echo:minimind3-export
      - -f
      - docker/minimind3/Dockerfile.export
      - .
    outputs: []
    resume: false

  build_infer_image:
    runtime: local
    image: minimind3.infer
    command:
      - docker
      - build
      - --platform
      - linux/amd64
      - -t
      - ccr.ccs.tencentyun.com/huyyxy/flash-echo:minimind3-infer
      - -f
      - docker/minimind3/Dockerfile.infer
      - .
    outputs: []
    resume: false

  serve:
    runtime: docker.minimind3-infer
    env:
      FLASH_ECHO_MODEL_VERSION: "{version}"
    command:
      - flash-echo
    inputs:
      - "{paths.deploy_dir}/model.onnx"
      - "{paths.deploy_dir}/inference_config.json"
    outputs: []
    resume: false
