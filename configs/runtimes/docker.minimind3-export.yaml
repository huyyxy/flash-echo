name: docker.minimind3-export
type: docker
image: ccr.ccs.tencentyun.com/huyyxy/flash-echo:minimind3-export
dockerfile: docker/minimind3/Dockerfile.export
platform: linux/amd64
gpu: none
workdir: /workspace
mounts:
  - source: .
    target: /workspace
env:
  PYTHONPATH: /workspace/src
  HF_HOME: /workspace/models/.cache/huggingface
  TRANSFORMERS_CACHE: /workspace/models/.cache/huggingface
