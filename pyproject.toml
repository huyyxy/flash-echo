[project]
name = "flash-echo"
version = "0.1.0"
description = "Low-latency filler words decision service for real-time voice interactions."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.111",
    "pydantic>=2.7",
    "uvicorn[standard]>=0.30",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2",
    "httpx>=0.27",
]
ml = [
    "jinja2>=3.1",
    "onnxruntime>=1.18",
    "optimum[onnxruntime]>=1.24",
    "transformers>=4.41",
    "torch>=2.3",
]

[project.scripts]
flash-echo = "filler_words.app:main"

[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
