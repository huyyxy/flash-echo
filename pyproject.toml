[project]
name = "flash-echo"
version = "0.1.0"
description = "Low-latency filler words decision service for real-time voice interactions."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.111",
    "pydantic>=2.7",
    "pyyaml>=6.0",
    "uvicorn[standard]>=0.30",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2",
    "httpx>=0.27",
]
infer = [
    "onnxruntime>=1.18",
    "optimum[onnxruntime]>=1.24",
    "transformers>=4.51,<5",
]
train = [
    "jinja2>=3.1",
    "torch>=2.3",
    "transformers>=4.51,<5",
]
ml = [
    "jinja2>=3.1",
    "onnxruntime>=1.18",
    "optimum[onnxruntime]>=1.24",
    "torch>=2.3",
    "transformers>=4.51,<5",
]

[project.scripts]
flash-echo = "flash_echo_bootstrap:launch_filler_app"
flash-echo-pipeline = "flash_echo_bootstrap:launch_pipeline_cli"

[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.package-dir]
"" = "src"

[tool.setuptools]
py-modules = ["flash_echo_bootstrap"]

[tool.setuptools.cmdclass]
editable_wheel = "build_hooks.EditableWheelWithBootstrap"
install = "build_hooks.InstallWithBootstrap"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
